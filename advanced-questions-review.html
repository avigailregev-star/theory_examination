const review=JSON.parse(localStorage.getItem("advanced-question-review-v1")||"{}");let ctx=null,playing=false;

const wait=ms=>new Promise(r=>setTimeout(r,ms));const ac=()=>ctx=ctx||new (AudioContext||webkitAudioContext)();
function note(c,m,w,d,a=false){const g=c.createGain(),o=c.createOscillator(),h=c.createOscillator(),hg=c.createGain(),f=440*Math.pow(2,(m-69)/12);o.type="triangle";o.frequency.value=f;h.type="sine";h.frequency.value=f*2;g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(a?.32:.22,w+.02);g.gain.exponentialRampToValueAtTime(.0001,w+d);hg.gain.setValueAtTime(.0001,w);hg.gain.exponentialRampToValueAtTime(.045,w+.02);hg.gain.exponentialRampToValueAtTime(.0001,w+Math.min(.6,d));o.connect(g).connect(c.destination);h.connect(hg).connect(c.destination);o.start(w);h.start(w);o.stop(w+d+.03);h.stop(w+d+.03)}
function click(c,w,a){const g=c.createGain(),o=c.createOscillator();o.type="square";o.frequency.value=a?1450:980;g.gain.setValueAtTime(.12,w);g.gain.exponentialRampToValueAtTime(.0001,w+.06);o.connect(g).connect(c.destination);o.start(w);o.stop(w+.07)}
async function playSpec(spec,count=false){if(playing||!spec)return;playing=true;try{const c=ac();await c.resume();const beat=60/(spec.tempo||72);if(count){for(let n=4;n>=1;n--){click(c,c.currentTime+.02,n===4);await wait(beat*1000)}}let cursor=0,start=c.currentTime+.06;for(const e of spec.events||[]){const d=(e.beats||1)*beat;(e.notes||[]).forEach(m=>note(c,m,start+cursor,Math.max(.16,d-.03),e.accent));cursor+=d}await wait((cursor+.1)*1000)}finally{playing=false}}
function rhythmSpec(items){const events=[];for(const x of items){if(x==="רבע")events.push({notes:[72],beats:1});else if(x==="שמינית")events.push({notes:[72],beats:.5});else if(x==="2")events.push({notes:[72],beats:1});else if(x==="3")events.push({notes:[72],beats:1.5});else events.push({notes:[72],beats:.75})}return{tempo:76,events}}
function media(q,i){if(q.audioSets)return '<div class="media">'+q.audioSets.map((x,j)=>'<button class="play" data-i="'+i+'" data-set="'+j+'">▶ דוגמה '+x.label+'</button>').join("")+'</div>';if(q.audioA)return '<div class="media"><button class="play" data-i="'+i+'" data-part="A">▶ דוגמה א׳</button><button class="play" data-i="'+i+'" data-part="B">▶ דוגמה ב׳</button></div>';if(q.audio||q.rhythm)return '<div class="media"><button class="play" data-i="'+i+'">▶ נגינה</button></div>';return ""}
function updateSummary(){const vals=Object.values(review);document.querySelector("#approved").textContent="אושרו: "+vals.filter(x=>x.status==="approved").length;document.querySelector("#rejected").textContent="לתיקון: "+vals.filter(x=>x.status==="rejected").length}
function render(){document.querySelector("#questions").innerHTML=QUESTIONS.map((q,i)=>{const r=review[q.id]||{};return '<article class="question" id="'+q.id+'"><div class="head"><div><div class="meta">'+esc(q.category)+' · רמה '+(q.level===6?"ו׳":"ז׳")+'</div><div class="skill">'+esc(q.skill)+'</div></div><span class="num">'+(i+1)+'</span></div><h2>'+esc(q.prompt)+'</h2>'+(q.abc?'<div class="notation" id="notation-'+i+'"></div>':"")+media(q,i)+'<div class="options">'+q.options.map(x=>'<button class="option" data-i="'+i+'" data-v="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div><button class="option reveal" data-i="'+i+'">הצגת התשובה וההסבר</button><div class="answer" id="answer-'+i+'"><strong>תשובה נכונה:</strong> '+esc(q.answer)+'<br><strong>מטרת הבדיקה:</strong> '+esc(q.skill)+'</div><div class="approval"><button class="approve '+(r.status==="approved"?"active":"")+'" data-i="'+i+'">מאשר/ת את השאלה</button><button class="reject '+(r.status==="rejected"?"active":"")+'" data-i="'+i+'">דורשת תיקון</button><input class="notes" data-i="'+i+'" placeholder="הערה לשאלה זו" value="'+esc(r.note||"")+'"><span class="review-state">'+(r.status==="approved"?"מאושרת":r.status==="rejected"?"מסומנת לתיקון":"טרם נבדקה")+'</span></div></article>'}).join("");QUESTIONS.forEach((q,i)=>q.abc&&ABCJS.renderAbc("notation-"+i,"X:1\n"+q.abc,{responsive:"resize",staffwidth:760,scale:.9}));bind();updateSummary()}
function save(){localStorage.setItem("advanced-question-review-v1",JSON.stringify(review));updateSummary()}
function bind(){document.querySelectorAll(".option[data-v]").forEach(b=>b.onclick=()=>{const q=QUESTIONS[+b.dataset.i];b.closest(".options").querySelectorAll(".option").forEach(x=>{x.classList.remove("selected","correct","wrong")});b.classList.add(b.dataset.v===q.answer?"correct":"wrong");document.querySelector("#answer-"+b.dataset.i).classList.add("show")});document.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>document.querySelector("#answer-"+b.dataset.i).classList.toggle("show"));document.querySelectorAll(".play").forEach(b=>b.onclick=async()=>{const q=QUESTIONS[+b.dataset.i];b.disabled=true;try{let spec=q.audio||q.audioA||rhythmSpec(q.rhythm||[]);if(b.dataset.part)spec=q["audio"+b.dataset.part];if(b.dataset.set)spec={tempo:72,events:q.audioSets[+b.dataset.set].notes.map(n=>({notes:[n],beats:.55}))};await playSpec(spec,Boolean(q.countIn||q.rhythm));b.textContent="↻ נגינה חוזרת"}finally{b.disabled=false}});document.querySelectorAll(".approve,.reject").forEach(b=>b.onclick=()=>{const q=QUESTIONS[+b.dataset.i],box=b.closest(".approval"),note=box.querySelector(".notes").value;review[q.id]={status:b.classList.contains("approve")?"approved":"rejected",note};save();render();location.hash=q.id});document.querySelectorAll(".notes").forEach(n=>n.onchange=()=>{const q=QUESTIONS[+n.dataset.i],old=review[q.id]||{};review[q.id]={...old,note:n.value};save()})}
document.querySelector("#export").onclick=async()=>{const lines=QUESTIONS.map((q,i)=>{const r=review[q.id]||{};return (i+1)+". "+q.id+" — "+(r.status==="approved"?"מאושרת":r.status==="rejected"?"לתיקון":"טרם נבדקה")+(r.note?" — "+r.note:"")}).join("\n");await navigator.clipboard.writeText(lines);alert("סיכום הביקורת הועתק")};render();
