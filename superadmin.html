<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול לקוחות</title><style>body{font-family:Arial;background:#f7f4ee;color:#111d3d;max-width:1000px;margin:40px auto;padding:0 20px}.card{background:#fff;padding:28px;border-radius:20px;margin:18px 0;box-shadow:0 10px 35px #1112}input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;font:inherit;border:1px solid #ccc;border-radius:9px}button{padding:12px 20px;border:0;border-radius:10px;background:#f8004f;color:#fff;font-weight:bold;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:#f7f4ee;padding:18px;border-radius:14px}.metric strong{display:block;font-size:30px;color:#f8004f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}.ok{color:#168665}.err{color:#a61e36}.muted{color:#666;font-size:14px}.inactive{opacity:.6;background:#f4f1ed}.row-actions{display:flex;gap:7px;align-items:center}.row-actions button{padding:8px 11px;font-size:13px}.toggle{background:#786849}.activate{background:#168665}.delete{background:#a61e36}@media(max-width:650px){.metrics{grid-template-columns:1fr}}</style></head><body>
<h1>ניהול חשבונות קונסרבטוריונים</h1>
<div id="login" class="card"><input id="pass" type="password" placeholder="סיסמת ניהול־על"><button id="loginBtn">כניסה</button><p id="loginErr" class="err"></p></div>
<div id="app" hidden>
<section class="metrics"><div class="metric"><strong id="tenantTotal">0</strong>לקוחות</div><div class="metric"><strong id="configuredTotal">0</strong>לקוחות פעילים</div><div class="metric"><strong id="studentTotal">0</strong>תלמידים פעילים</div></section>
<section class="card"><h2>פתיחת חשבון חדש</h2><p>כאן מזינים רק פרטי גישה. הקונסרבטוריון ימלא בעצמו את שמו, הלוגו ומערכת השעות.</p><input id="slug" dir="ltr" placeholder="מזהה לכתובת באנגלית, למשל hadera"><input id="email" type="email" placeholder="דוא״ל מנהל הקונסרבטוריון"><input id="temporaryPassword" type="password" placeholder="סיסמה זמנית — לפחות 8 תווים"><button id="createBtn">יצירת חשבון</button><p id="createErr" class="err"></p><div id="invite" class="ok"></div></section>
<section class="card"><h2>כל הלקוחות</h2><p id="actionErr" class="err"></p><div class="table-wrap"><table><thead><tr><th>שם</th><th>מזהה</th><th>מצב</th><th>תלמידים</th><th>תפוסת קבוצות</th><th>כניסה</th><th>פעולות</th></tr></thead><tbody id="tenants"></tbody></table></div></section>
</div><script>
let password='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){const res=await fetch('/api/superadmin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,...body})});const data=await res.json();if(!res.ok)throw new Error(data.error||'הפעולה נכשלה');return data}
async function load(){const {tenants,totals}=await call({action:'list'});$('tenantTotal').textContent=totals.tenants;$('configuredTotal').textContent=totals.configured;$('studentTotal').textContent=totals.activeStudents;$('tenants').innerHTML=tenants.map(t=>`<tr class="${t.active?'':'inactive'}"><td>${esc(t.name)}</td><td dir="ltr">${esc(t.slug)}</td><td>${t.active?(t.configured?'פעיל':'ממתין להגדרה'):'מושבת'}</td><td>${t.activeStudents}</td><td>${t.occupancy.booked}/${t.occupancy.capacity}</td><td>${t.active?`<a href="/theory-${encodeURIComponent(t.slug)}/admin" target="_blank">ניהול לקוח</a>`:'—'}</td><td><div class="row-actions"><button class="toggle ${t.active?'':'activate'}" data-slug="${esc(t.slug)}">${t.active?'השבתה':'הפעלה'}</button><button class="delete" data-slug="${esc(t.slug)}">מחיקה</button></div></td></tr>`).join('');document.querySelectorAll('.toggle').forEach(btn=>btn.onclick=async()=>{const verb=btn.textContent==='הפעלה'?'להפעיל':'להשבית';if(!confirm(`${verb} את הלקוח ${btn.dataset.slug}?`))return;try{await call({action:'toggle-active',slug:btn.dataset.slug});await load()}catch(e){$('actionErr').textContent=e.message}});document.querySelectorAll('.delete').forEach(btn=>btn.onclick=async()=>{const slug=btn.dataset.slug;const typed=prompt(`מחיקה לצמיתות תמחק את הלקוח, התלמידים, התוצאות והקבוצות שלו.\nכדי לאשר, הקלידי: ${slug}`);if(typed!==slug)return;try{await call({action:'delete',slug,confirmSlug:typed});await load()}catch(e){$('actionErr').textContent=e.message}})}
$('loginBtn').onclick=async()=>{password=$('pass').value;try{await load();$('login').hidden=true;$('app').hidden=false}catch(e){$('loginErr').textContent=e.message}};
$('createBtn').onclick=async()=>{ $('createErr').textContent='';$('invite').textContent='';try{const data=await call({action:'create',slug:$('slug').value.trim().toLowerCase(),email:$('email').value.trim(),temporaryPassword:$('temporaryPassword').value});$('invite').innerHTML='החשבון נוצר. יש לשלוח לקונסרבטוריון את הקישור ופרטי הכניסה:<br><a href="'+esc(data.inviteUrl)+'" target="_blank">'+esc(data.inviteUrl)+'</a>';await load()}catch(e){$('createErr').textContent=e.message}};
</script></body></html>
