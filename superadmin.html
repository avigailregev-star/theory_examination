<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול לקוחות</title><style>body{font-family:Arial;background:#f7f4ee;color:#111d3d;max-width:1000px;margin:40px auto;padding:0 20px}.card{background:#fff;padding:28px;border-radius:20px;margin:18px 0;box-shadow:0 10px 35px #1112}input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;font:inherit;border:1px solid #ccc;border-radius:9px}button{padding:12px 20px;border:0;border-radius:10px;background:#f8004f;color:#fff;font-weight:bold;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:#f7f4ee;padding:18px;border-radius:14px}.metric strong{display:block;font-size:30px;color:#f8004f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}.ok{color:#168665}.err{color:#a61e36}.muted{color:#666;font-size:14px}.inactive{opacity:.6;background:#f4f1ed}.row-actions{display:flex;gap:7px;align-items:center}.row-actions button{padding:8px 11px;font-size:13px}.toggle{background:#786849}.activate{background:#168665}.delete{background:#a61e36}@media(max-width:650px){.metrics{grid-template-columns:1fr}}</style><style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&display=swap');
*{box-sizing:border-box}body{font-family:"Heebo",Arial,sans-serif;background:#f7f5ef;color:#18181c;max-width:1180px;margin:0 auto;padding:clamp(22px,4vw,48px)}body>h1{margin:0 0 30px;padding-bottom:17px;border-bottom:5px solid #18181c;font-weight:500}.card{background:transparent;padding:24px 0;border:0;border-radius:0;box-shadow:none;border-bottom:2px solid #18181c}.card h2{font-weight:500;border-bottom:3px solid #18181c;padding-bottom:8px}.card p{color:#505056}input{min-height:52px;padding:13px 14px;margin:7px 0;border:1.5px solid #18181c;border-radius:0;background:#fff;color:#18181c}input:focus{outline:0;border-color:#e13030;box-shadow:0 0 0 3px #e1303022}button{min-height:48px;padding:11px 18px;border:1px solid #18181c;border-radius:0;background:#18181c;color:#f7f5ef;font:inherit;font-weight:500;box-shadow:none}button:hover{background:#e13030}.metrics{gap:18px;margin-bottom:22px}.metric{background:transparent;border-block:2px solid #18181c;border-radius:0;padding:18px}.metric strong{color:#e13030;font-weight:500}.table-wrap{overflow:auto}table{min-width:900px}th{background:transparent;border-bottom:2px solid #18181c}th,td{padding:13px 8px}.row-actions{gap:8px}.row-actions button{min-height:auto;padding:7px 10px}.err{color:#e13030}.ok{background:#ffd400;color:#18181c;padding:12px 14px}a{color:#18181c;text-underline-offset:3px}a:hover{color:#e13030}@media(max-width:700px){body{padding:22px 14px}.metrics{grid-template-columns:1fr}.card{padding:18px 0}.row-actions{display:grid}}
</style></head><body>
<h1>ניהול חשבונות קונסרבטוריונים</h1>
<div id="login" class="card"><form id="loginForm"><input id="pass" type="password" autocomplete="current-password" placeholder="סיסמת ניהול־על"><button id="loginBtn" type="submit">כניסה</button><p id="loginErr" class="err" role="alert"></p></form></div>
<div id="app" hidden>
<section class="metrics"><div class="metric"><strong id="tenantTotal">0</strong>לקוחות</div><div class="metric"><strong id="configuredTotal">0</strong>לקוחות פעילים</div><div class="metric"><strong id="studentTotal">0</strong>תלמידים פעילים</div></section>
<section class="card"><h2>פתיחת חשבון חדש</h2><p>כאן מזינים רק פרטי גישה. הקונסרבטוריון ימלא בעצמו את שמו, הלוגו ומערכת השעות.</p><form id="createForm"><input id="slug" dir="ltr" autocomplete="off" placeholder="מזהה לכתובת באנגלית, למשל hadera"><input id="email" type="email" autocomplete="username" placeholder="דוא״ל מנהל הקונסרבטוריון"><input id="temporaryPassword" type="password" autocomplete="new-password" placeholder="סיסמה זמנית — לפחות 8 תווים"><button id="createBtn" type="submit">יצירת חשבון</button><p id="createErr" class="err" role="alert"></p><div id="invite" class="ok" aria-live="polite"></div></form></section>
<section class="card"><h2>כל הלקוחות</h2><p id="actionErr" class="err"></p><div class="table-wrap"><table><thead><tr><th>שם</th><th>מזהה</th><th>מצב</th><th>תלמידים</th><th>תפוסת קבוצות</th><th>כניסה</th><th>פעולות</th></tr></thead><tbody id="tenants"></tbody></table></div></section>
</div><script>
let password='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){const res=await fetch('/api/superadmin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,...body})});const data=await res.json();if(!res.ok)throw new Error(data.error||'הפעולה נכשלה');return data}
async function load(){const {tenants,totals}=await call({action:'list'});$('tenantTotal').textContent=totals.tenants;$('configuredTotal').textContent=totals.configured;$('studentTotal').textContent=totals.activeStudents;$('tenants').innerHTML=tenants.map(t=>`<tr class="${t.active?'':'inactive'}"><td>${esc(t.name)}</td><td dir="ltr">${esc(t.slug)}</td><td>${t.active?(t.configured?'פעיל':'ממתין להגדרה'):'מושבת'}</td><td>${t.activeStudents}</td><td>${t.occupancy.booked}/${t.occupancy.capacity}</td><td>${t.active?`<a href="/theory-${encodeURIComponent(t.slug)}/admin" target="_blank">ניהול לקוח</a>`:'—'}</td><td><div class="row-actions"><button class="toggle ${t.active?'':'activate'}" data-slug="${esc(t.slug)}">${t.active?'השבתה':'הפעלה'}</button><button class="delete" data-slug="${esc(t.slug)}">מחיקה</button></div></td></tr>`).join('');document.querySelectorAll('.toggle').forEach(btn=>btn.onclick=async()=>{const verb=btn.textContent==='הפעלה'?'להפעיל':'להשבית';if(!confirm(`${verb} את הלקוח ${btn.dataset.slug}?`))return;try{await call({action:'toggle-active',slug:btn.dataset.slug});await load()}catch(e){$('actionErr').textContent=e.message}});document.querySelectorAll('.delete').forEach(btn=>btn.onclick=async()=>{const slug=btn.dataset.slug;const typed=prompt(`מחיקה לצמיתות תמחק את הלקוח, התלמידים, התוצאות והקבוצות שלו.\nכדי לאשר, הקלידי: ${slug}`);if(typed!==slug)return;try{await call({action:'delete',slug,confirmSlug:typed});await load()}catch(e){$('actionErr').textContent=e.message}})}
$('loginForm').onsubmit=async event=>{event.preventDefault();const button=$('loginBtn');password=$('pass').value;$('loginErr').textContent='';button.disabled=true;try{await load();$('login').hidden=true;$('app').hidden=false}catch(e){$('loginErr').textContent=e.message}finally{button.disabled=false}};
$('createForm').onsubmit=async event=>{event.preventDefault();const button=$('createBtn');$('createErr').textContent='';$('invite').textContent='';const email=$('email').value.trim(),temporaryPassword=$('temporaryPassword').value;button.disabled=true;try{const data=await call({action:'create',slug:$('slug').value.trim().toLowerCase(),email,temporaryPassword});$('invite').innerHTML='החשבון נוצר. יש לשלוח לקונסרבטוריון את פרטי הכניסה:<br>שם משתמש: <strong>'+esc(email)+'</strong><br>סיסמה זמנית: <strong>'+esc(temporaryPassword)+'</strong><br><a href="'+esc(data.inviteUrl)+'" target="_blank">'+esc(data.inviteUrl)+'</a>';await load()}catch(e){$('createErr').textContent=e.message}finally{button.disabled=false}};
</script></body></html>
